<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply LOKER</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white font-sans antialiased min-h-screen pb-24">

  <!-- Container Utama -->
  <div class="max-w-md mx-auto p-4">

    <!-- Header / Judul -->
    <div class="flex justify-between items-center mb-4">
      <div>
        <p class="text-xs text-zinc-400">Info loker bang</p>
        <h1 class="text-xl font-bold tracking-wider">Apply LOKER</h1>
      </div>
      <button class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-full hover:bg-zinc-800 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-zinc-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01" />
        </svg>
      </button>
    </div>

    <!-- Kolom Pencarian -->
    <div class="mb-4">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
        <input type="text" placeholder="Cari perusahaan atau posisi..." class="w-full bg-zinc-900 border border-zinc-800 text-sm rounded-xl pl-10 pr-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-pink-500 transition">
      </div>
    </div>

    <!-- Widget Catatan & Tanggal -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 mb-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <button class="text-pink-400 text-xs font-semibold bg-pink-500/10 px-3 py-1.5 rounded-lg hover:bg-pink-500/20 transition">
          ▶ Buka Catatan
        </button>
        <span class="text-xs text-zinc-400">| Harian (27 Sep 2026)</span>
      </div>
      <div class="flex space-x-2">
        <button class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg transition">Riwayat</button>
        <button class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg transition">Simpan</button>
      </div>
    </div>

    <!-- KARTU STATISTIK & FILTER INTERAKTIF (Digabung di sini) -->
    <div class="flex space-x-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
      
      <!-- Kartu Total -->
      <button onclick="setFilter('total', this)" class="filter-card flex-shrink-0 bg-zinc-900 border-2 border-pink-500 rounded-xl p-3 w-20 text-center transition-all cursor-pointer">
        <div class="text-[11px] text-zinc-400 font-medium">Total</div>
        <div class="text-lg font-bold text-white mt-1">0</div>
      </button>

      <!-- Kartu Proses -->
      <button onclick="setFilter('proses', this)" class="filter-card flex-shrink-0 bg-zinc-900 border border-zinc-800 hover:border-blue-500 rounded-xl p-3 w-20 text-center transition-all cursor-pointer">
        <div class="text-[11px] text-zinc-400 font-medium">Proses</div>
        <div class="text-lg font-bold text-blue-400 mt-1">0</div>
      </button>

      <!-- Kartu Interview -->
      <button onclick="setFilter('interview', this)" class="filter-card flex-shrink-0 bg-zinc-900 border border-zinc-800 hover:border-yellow-500 rounded-xl p-3 w-20 text-center transition-all cursor-pointer">
        <div class="text-[11px] text-zinc-400 font-medium">Interview</div>
        <div class="text-lg font-bold text-yellow-400 mt-1">0</div>
      </button>

      <!-- Kartu Diterima -->
      <button onclick="setFilter('diterima', this)" class="filter-card flex-shrink-0 bg-zinc-900 border border-zinc-800 hover:border-green-500 rounded-xl p-3 w-20 text-center transition-all cursor-pointer">
        <div class="text-[11px] text-zinc-400 font-medium">Diterima</div>
        <div class="text-lg font-bold text-green-400 mt-1">0</div>
      </button>

      <!-- Kartu Ditolak -->
      <button onclick="setFilter('ditolak', this)" class="filter-card flex-shrink-0 bg-zinc-900 border border-zinc-800 hover:border-red-500 rounded-xl p-3 w-20 text-center transition-all cursor-pointer">
        <div class="text-[11px] text-zinc-400 font-medium">Ditolak</div>
        <div class="text-lg font-bold text-red-400 mt-1">0</div>
      </button>

    </div>

    <!-- (Tombol Filter Duplikat di Bawah Sudah Dihapus Supaya UI Lebih Longgar) -->

    <!-- Bagian Info Lamaran -->
    <div class="mt-2">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-base">Info Lamaran</h2>
        <span class="text-xs text-zinc-500">0 dari 0 lamaran</span>
      </div>

      <!-- Tab Tampilan (Detail / Tabel) -->
      <div class="flex bg-zinc-900 p-1 rounded-xl border border-zinc-800 mb-4 w-fit">
        <button class="text-xs px-4 py-1.5 bg-zinc-800 rounded-lg font-medium text-white shadow">Detail</button>
        <button class="text-xs px-4 py-1.5 text-zinc-400 hover:text-white transition">Tabel</button>
      </div>

      <!-- Empty State (Kondisi Kosong) -->
      <div class="flex flex-col items-center justify-center py-16 text-center border border-dashed border-zinc-800 rounded-2xl mt-2">
        <div class="w-12 h-12 bg-zinc-900 rounded-full flex items-center justify-center mb-3 text-zinc-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
        </div>
        <p class="text-sm text-zinc-400">Belum ada info loker.</p>
        <p class="text-xs text-zinc-600 mt-1">Tekan tombol <span class="text-pink-500 font-bold">+</span> di bawah untuk menambah.</p>
      </div>
    </div>

  </div>

  <!-- Floating Action Button (FAB) & Maskot Bawah -->
  <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto flex justify-between items-center pointer-events-none">
    <!-- Maskot / Ikon Tengkorak Kiri -->
    <div class="pointer-events-auto bg-zinc-900 border border-zinc-800 p-2.5 rounded-2xl shadow-lg flex items-center justify-center">
      <span class="text-xl">💀</span>
    </div>
    
    <!-- Tombol Tambah (+) Kanan -->
    <button class="pointer-events-auto bg-pink-500 hover:bg-pink-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-pink-500/30 transition-transform active:scale-95">
      <svg class="w-6 h-6 font-bold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
    </button>
  </div>

  <!-- Script Interaksi Filter -->
  <script>
    function setFilter(status, element) {
      const cards = document.querySelectorAll('.filter-card');
      cards.forEach(card => {
        card.classList.remove('border-pink-500', 'border-blue-500', 'border-yellow-500', 'border-green-500', 'border-red-500', 'border-2');
        card.classList.add('border', 'border-zinc-800');
      });

      element.classList.remove('border-zinc-800');
      element.classList.add('border-2');
      if(status === 'total') element.classList.add('border-pink-500');
      if(status === 'proses') element.classList.add('border-blue-500');
      if(status === 'interview') element.classList.add('border-yellow-500');
      if(status === 'diterima') element.classList.add('border-green-500');
      if(status === 'ditolak') element.classList.add('border-red-500');

      console.log("Filter aktif:", status);
    }
  </script>

</body>
</html>
