<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="meta-theme-color" name="theme-color" content="#1a1a1a">
    <title>Apply LOKER - Cloud Edition</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apply LOKER">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-pixel { font-family: 'Press Start 2P', cursive; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #ff5ca0; border-radius: 4px; }
        @keyframes breathe {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.03) translateY(-1px); }
        }
        .animate-breathe { animation: breathe 3s ease-in-out infinite; transform-origin: bottom; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=range] { accent-color: #ff5ca0; }
    </style>
</head>
<body id="body-app" class="bg-[#121212] text-gray-200 min-h-screen relative pb-36 transition-colors duration-300 overflow-x-hidden">

    <!-- HALAMAN LOGIN / AUTH -->
    <div id="auth-screen" class="fixed inset-0 bg-[#121212] z-50 flex items-center justify-center p-4">
        <div class="bg-[#1e1e1e] border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-xl font-pixel text-white tracking-wide">Apply LOKER</h2>
                <p id="auth-subtitle" class="text-xs text-gray-400">Masuk untuk akses data dari perangkat apa saja.</p>
            </div>
            
            <div id="auth-error" class="bg-red-500/20 border border-red-500 text-red-300 text-xs p-3 rounded-xl hidden"></div>

            <form id="form-auth" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">EMAIL</label>
                    <input type="email" id="auth-email" required placeholder="nama@email.com" class="w-full bg-[#121212] border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#ff5ca0]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">PASSWORD</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-[#121212] border border-gray-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#ff5ca0]">
                </div>
                <button type="submit" id="btn-auth-submit" class="w-full bg-[#ff5ca0] hover:bg-[#ff4081] text-white font-bold py-3 rounded-xl transition-colors text-xs shadow-lg">
                    Masuk
                </button>
            </form>

            <div class="text-center pt-2 border-t border-gray-800 space-y-2">
                <button onclick="toggleAuthMode()" id="btn-toggle-auth" class="text-xs text-[#ff5ca0] font-semibold hover:underline">
                    Belum punya akun? Daftar di sini
                </button>
                <div>
                    <button onclick="loginGoogle()" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 transition-colors mt-2">
                        <span>🔍 Masuk dengan Google</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- APLIKASI UTAMA -->
    <div id="app-content" class="hidden">
        <header id="header-app" class="bg-[#1a1a1a] px-4 py-5 md:px-6 shadow-md border-b border-gray-800 transition-colors duration-300">
            <div class="max-w-4xl mx-auto flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-[11px] md:text-xs text-gray-400 font-medium mb-1">Login as: <span id="user-email-label" class="text-[#ff5ca0] font-bold"></span></h1>
                        <h2 class="text-lg md:text-2xl text-white font-pixel tracking-wide leading-none">Apply LOKER</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="logoutUser()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-red-500/20 text-red-300 border border-red-500/30 hover:bg-red-500/30 transition-all">
                            Keluar
                        </button>
                        <div class="relative">
                            <button onclick="toggleMenuTitikTiga(event)" id="btn-menu-titiktiga" class="w-9 h-9 rounded-xl text-sm font-bold border border-gray-700 bg-[#2d2d2d] text-gray-300 shadow-sm hover:scale-105 transition-all flex items-center justify-center shrink-0">⋮</button>
                            <div id="dropdown-titiktiga" class="absolute right-0 mt-2 w-64 bg-[#1e1e1e] border border-gray-700 rounded-xl shadow-2xl hidden z-50 overflow-hidden py-1">
                                <button onclick="bukaModalPanduan()" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-black/15 text-[#ff5ca0]">📖 Panduan & Cara Pakai</button>
                                <button onclick="bukaModalTemplateGlobal()" class="w-full text-left px-4 py-2.5 text-xs font-semibold hover:bg-black/15 text-gray-200">Atur Template & Pesan</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <input type="text" id="input-pencarian" oninput="renderTampilan()" placeholder="Cari perusahaan atau posisi..." class="search-input w-full bg-[#121212] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#ff5ca0] shadow-inner">
                </div>
            </div>
        </header>
        
        <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
            <div class="grid grid-cols-5 gap-2 md:gap-3 text-center">
                <div onclick="setFilterStatus('Semua')" id="card-total" class="bg-[#1e1e1e] py-3 px-1 rounded-xl shadow-sm border-t-[4px] border-gray-500 cursor-pointer hover:bg-white/5 transition-all ring-2 ring-[#ff5ca0]">
                    <p class="text-[10px] text-gray-400 font-bold mb-1">Total</p>
                    <p class="text-base md:text-2xl font-bold" id="stat-total">0</p>
                </div>
                <div onclick="setFilterStatus('Proses')" id="card-proses" class="bg-[#1e1e1e] py-3 px-1 rounded-xl shadow-sm border-t-[4px] border-blue-500 cursor-pointer hover:bg-white/5 transition-all">
                    <p class="text-[10px] text-gray-400 font-bold mb-1">Proses</p>
                    <p class="text-base md:text-2xl font-bold" id="stat-proses">0</p>
                </div>
                <div onclick="setFilterStatus('Interview')" id="card-interview" class="bg-[#1e1e1e] py-3 px-1 rounded-xl shadow-sm border-t-[4px] border-yellow-500 cursor-pointer hover:bg-white/5 transition-all">
                    <p class="text-[10px] text-gray-400 font-bold mb-1">Interview</p>
                    <p class="text-base md:text-2xl font-bold" id="stat-interview">0</p>
                </div>
                <div onclick="setFilterStatus('Diterima')" id="card-diterima" class="bg-[#1e1e1e] py-3 px-1 rounded-xl shadow-sm border-t-[4px] border-green-500 cursor-pointer hover:bg-white/5 transition-all">
                    <p class="text-[10px] text-gray-400 font-bold mb-1">Diterima</p>
                    <p class="text-base md:text-2xl font-bold" id="stat-diterima">0</p>
                </div>
                <div onclick="setFilterStatus('Arsip')" id="card-ditolak" class="bg-[#1e1e1e] py-3 px-1 rounded-xl shadow-sm border-t-[4px] border-red-500 cursor-pointer hover:bg-white/5 transition-all">
                    <p class="text-[10px] text-gray-400 font-bold mb-1">Ditolak</p>
                    <p class="text-base md:text-2xl font-bold" id="stat-ditolak">0</p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <div>
                        <h3 class="text-lg md:text-xl font-bold text-white">Info Lamaran</h3>
                        <p class="text-xs text-gray-400" id="teks-jumlah-lamaran">0 dari 0 lamaran</p>
                    </div>
                    <div id="view-toggle-bg" class="flex gap-1 bg-[#1a1a1a] p-1 rounded-lg border border-gray-800">
                        <button id="btn-view-card" onclick="setModeTampilan('card')" class="px-3.5 py-1.5 rounded bg-[#2d2d2d] font-bold text-xs text-white">Detail</button>
                        <button id="btn-view-tabel" onclick="setModeTampilan('tabel')" class="px-3.5 py-1.5 rounded text-gray-400 font-bold text-xs">Tabel</button>
                    </div>
                </div>
                
                <div id="view-card" class="space-y-3"></div>

                <div id="view-tabel" class="hidden bg-[#1e1e1e] rounded-xl shadow-sm border border-gray-800 overflow-x-auto pb-3">
                    <table class="w-full text-left text-xs min-w-[600px]">
                        <thead class="bg-[#1a1a1a] text-gray-400 border-b border-gray-800">
                            <tr>
                                <th class="p-3 font-bold w-[35%]">Perusahaan / Posisi</th>
                                <th class="p-3 font-bold hidden md:table-cell md:w-[15%]">Tgl Lamar</th>
                                <th class="p-3 font-bold text-yellow-500 hidden md:table-cell md:w-[15%]">Follow Up</th>
                                <th class="p-3 font-bold w-[30%]">Status</th>
                                <th class="p-3 font-bold w-[20%] text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="body-tabel"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL FORM TAMBAH/EDIT -->
    <div id="modal-form" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#1e1e1e] border border-gray-700 rounded-xl shadow-2xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-white" id="modal-judul">Tambah Info Loker</h2>
                <button onclick="tutupModal()" class="bg-gray-800 hover:bg-gray-700 rounded text-gray-400 px-3 py-1 font-bold">&times;</button>
            </div>
            <form id="form-lamaran" onsubmit="simpanLamaran(event)">
                <input type="hidden" id="input-id">
                <div class="mb-3">
                    <label class="block text-xs font-bold text-gray-400 mb-1">NAMA PERUSAHAAN *</label>
                    <input type="text" id="input-perusahaan" required placeholder="Contoh: PT Tokopedia..." class="w-full bg-[#121212] border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#ff5ca0]">
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold text-gray-400 mb-1">POSISI YANG DILAMAR *</label>
                    <input type="text" id="input-posisi" required placeholder="Contoh: Frontend Developer..." class="w-full bg-[#121212] border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#ff5ca0]">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">TGL MELAMAR *</label>
                        <input type="date" id="input-tanggal" required class="w-full bg-[#121212] border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#ff5ca0]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-green-500 mb-1">STATUS</label>
                        <select id="input-status" class="w-full bg-[#121212] border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#ff5ca0]">
                            <option value="Rencana Daftar">Rencana Daftar</option>
                            <option value="Terkirim">Terkirim</option>
                            <option value="Screening HR">Screening HR</option>
                            <option value="Psikotes">Psikotes</option>
                            <option value="Tes Online">Tes Online</option>
                            <option value="Tes Teknis">Tes Teknis</option>
                            <option value="Interview HR">Interview HR</option>
                            <option value="Interview User">Interview User</option>
                            <option value="Final Interview">Final Interview</option>
                            <option value="Medical Check Up">Medical Check Up</option>
                            <option value="Offering">Offering</option>
                            <option value="Diterima">Diterima</option>
                            <option value="Ditolak">Ditolak</option>
                            <option value="Tidak Ada Kabar">Tidak Ada Kabar</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-[11px] font-bold text-purple-400 mb-1">KONTAK (WA / EMAIL)</label>
                    <input type="text" id="input-kontak" placeholder="No WA / Email" class="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-xs text-purple-300">
                </div>
                <button type="submit" class="w-full bg-[#ff5ca0] text-white font-bold py-2.5 rounded-lg hover:bg-[#ff4081] transition-colors text-xs shadow-md mt-2">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <!-- MODAL TEMPLATE PESAN -->
    <div id="modal-template" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-[#1e1e1e] border border-gray-700 rounded-xl shadow-2xl w-full max-w-lg p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-white">Atur Template Pesan Konfirmasi Interview</h2>
                <button onclick="tutupModalTemplate()" class="bg-gray-800 hover:bg-gray-700 rounded text-gray-400 px-3 py-1 font-bold">&times;</button>
            </div>
            <textarea id="text-template-interview" rows="6" class="w-full bg-[#121212] border border-gray-700 rounded-lg p-3 text-xs text-white mb-3"></textarea>
            <button onclick="simpanTemplate()" class="w-full bg-[#ff5ca0] text-white font-bold py-2.5 rounded-lg text-xs">Simpan Template</button>
        </div>
    </div>

    <!-- TOMBOL TAMBAH FLOATING -->
    <button onclick="bukaModalTambah()" class="fixed bottom-6 right-6 bg-[#ff5ca0] hover:bg-[#ff4081] text-white w-14 h-14 rounded-full text-3xl font-bold shadow-lg flex items-center justify-center transition-transform hover:scale-110 z-20">+</button>

    <script>
        // ==========================================
        // KONFIGURASI FIREBASE KAMU (SUDAH DIPASANG)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDG5qmJD0EGEaJRGNtvd8U6jTQDj3cvXRA",
            authDomain: "infol-61428.firebaseapp.com",
            projectId: "infol-61428",
            storageBucket: "infol-61428.firebasestorage.app",
            messagingSenderId: "139934994775",
            appId: "1:139934994775:web:7ddf166a0e962c5c286e12",
            measurementId: "G-F04YS5MX1T"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let dataLamaran = [];
        let isSignUpMode = false;
        let currentMode = 'card';
        let currentFilterStatus = 'Semua';

        const defaultTemplateInterview = `Yth. Bapak/Ibu HRD {perusahaan},\n\nTerima kasih banyak atas undangan serta kesempatan interview untuk posisi {posisi}. Melalui pesan ini, saya bermaksud mengonfirmasi bahwa saya akan hadir memenuhi undangan tersebut sesuai dengan jadwal yang telah ditentukan.\n\nSekali lagi terima kasih atas kesempatan yang diberikan.\n\nHormat saya,\n[Nama Anda]`;
        let templateInterview = localStorage.getItem('lokertrack_template_interview') || defaultTemplateInterview;

        // Pantau Status Login Firebase
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-email-label').innerText = user.email;
                muatDataCloud();
            } else {
                currentUser = null;
                document.getElementById('app-content').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('btn-auth-submit').innerText = isSignUpMode ? "Daftar Akun Baru" : "Masuk";
            document.getElementById('btn-toggle-auth').innerText = isSignUpMode ? "Sudah punya akun? Masuk di sini" : "Belum punya akun? Daftar di sini";
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const errBox = document.getElementById('auth-error');
            errBox.classList.add('hidden');

            if (isSignUpMode) {
                auth.createUserWithEmailAndPassword(email, pass).catch(err => {
                    errBox.innerText = err.message; errBox.classList.remove('hidden');
                });
            } else {
                auth.signInWithEmailAndPassword(email, pass).catch(err => {
                    errBox.innerText = err.message; errBox.classList.remove('hidden');
                });
            }
        }

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert(err.message));
        }

        function logoutUser() {
            auth.signOut();
        }

        // Ambil Data dari Firestore Realtime
        function muatDataCloud() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('lamaran').onSnapshot((snapshot) => {
                dataLamaran = [];
                snapshot.forEach(doc => {
                    dataLamaran.push({ id: doc.id, ...doc.data() });
                });
                renderTampilan();
            });
        }

        function simpanKeCloud(lamaranBaru) {
            if (!currentUser) return;
            const idDoc = lamaranBaru.id ? lamaranBaru.id.toString() : Date.now().toString();
            db.collection('users').doc(currentUser.uid).collection('lamaran').doc(idDoc).set(lamaranBaru);
        }

        function hapusDariCloud(id) {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('lamaran').doc(id.toString()).delete();
        }

        function toggleMenuTitikTiga(event) {
            event.stopPropagation();
            document.getElementById('dropdown-titiktiga').classList.toggle('hidden');
        }

        window.addEventListener('click', () => {
            const drop = document.getElementById('dropdown-titiktiga');
            if(drop) drop.classList.add('hidden');
        });

        function bukaModalTambah() {
            document.getElementById('modal-judul').innerText = "Tambah Info Loker";
            document.getElementById('form-lamaran').reset();
            document.getElementById('input-id').value = "";
            document.getElementById('input-tanggal').valueAsDate = new Date();
            document.getElementById('modal-form').classList.remove('hidden');
        }

        function tutupModal() { document.getElementById('modal-form').classList.add('hidden'); }

        function simpanLamaran(e) {
            e.preventDefault();
            const id = document.getElementById('input-id').value || Date.now();
            const dataBaru = {
                id: id,
                perusahaan: document.getElementById('input-perusahaan').value,
                posisi: document.getElementById('input-posisi').value,
                tanggal: document.getElementById('input-tanggal').value,
                kontak: document.getElementById('input-kontak').value,
                status: document.getElementById('input-status').value
            };
            simpanKeCloud(dataBaru);
            tutupModal();
        }

        function hapusLamaran(id) {
            if (confirm("Hapus data ini?")) hapusDariCloud(id);
        }

        function ubahStatus(id, statusBaru) {
            const item = dataLamaran.find(l => l.id == id);
            if (item) {
                item.status = statusBaru;
                simpanKeCloud(item);
            }
        }

        function setModeTampilan(mode) {
            currentMode = mode;
            document.getElementById('view-card').classList.toggle('hidden', mode !== 'card');
            document.getElementById('view-tabel').classList.toggle('hidden', mode !== 'tabel');
        }

        function setFilterStatus(status) {
            currentFilterStatus = status;
            renderTampilan();
        }

        function bukaModalTemplateGlobal() {
            document.getElementById('text-template-interview').value = templateInterview;
            document.getElementById('modal-template').classList.remove('hidden');
        }
        function tutupModalTemplate() { document.getElementById('modal-template').classList.add('hidden'); }
        function simpanTemplate() {
            templateInterview = document.getElementById('text-template-interview').value;
            localStorage.setItem('lokertrack_template_interview', templateInterview);
            alert("Template disimpan!");
            tutupModalTemplate();
        }

        function renderTampilan() {
            const containerCard = document.getElementById('view-card');
            const containerTabel = document.getElementById('body-tabel');
            const keyword = document.getElementById('input-pencarian').value.toLowerCase();
            containerCard.innerHTML = ''; containerTabel.innerHTML = '';

            let statTotal = dataLamaran.length, statProses = 0, statInterview = 0, statDiterima = 0, statDitolak = 0;
            dataLamaran.forEach(l => {
                if (["Screening HR", "Psikotes", "Tes Online", "Tes Teknis", "Medical Check Up", "Offering", "Rencana Daftar", "Terkirim"].includes(l.status)) statProses++;
                if (["Interview HR", "Interview User", "Final Interview"].includes(l.status)) statInterview++;
                if (l.status === 'Diterima') statDiterima++;
                if (["Ditolak", "Tidak Ada Kabar"].includes(l.status)) statDitolak++;
            });

            const filtered = dataLamaran.filter(l => {
                const match = l.perusahaan.toLowerCase().includes(keyword) || l.posisi.toLowerCase().includes(keyword);
                if (!match) return false;
                if (currentFilterStatus === 'Proses') return ["Screening HR", "Psikotes", "Tes Online", "Tes Teknis", "Medical Check Up", "Offering", "Rencana Daftar", "Terkirim"].includes(l.status);
                if (currentFilterStatus === 'Interview') return ["Interview HR", "Interview User", "Final Interview"].includes(l.status);
                if (currentFilterStatus === 'Diterima') return l.status === 'Diterima';
                if (currentFilterStatus === 'Arsip') return ["Ditolak", "Tidak Ada Kabar"].includes(l.status);
                return true;
            });

            if (filtered.length === 0) {
                containerCard.innerHTML = `<p class="text-center text-gray-500 py-10 text-xs">Belum ada data lamaran.</p>`;
                containerTabel.innerHTML = `<tr><td colspan="5" class="text-center text-gray-500 py-10 text-xs">Belum ada data lamaran.</td></tr>`;
            }

            const daftarStatus = ["Rencana Daftar", "Terkirim", "Screening HR", "Psikotes", "Tes Online", "Tes Teknis", "Interview HR", "Interview User", "Final Interview", "Medical Check Up", "Offering", "Diterima", "Ditolak", "Tidak Ada Kabar"];

            filtered.forEach(l => {
                const optionsHTML = daftarStatus.map(s => `<option value="${s}" ${l.status === s ? 'selected' : ''}>${s}</option>`).join('');
                
                let waLink = '#';
                if (l.kontak) {
                    let noWa = l.kontak.replace(/[^0-9]/g, '');
                    if (noWa.startsWith('0')) noWa = '62' + noWa.slice(1);
                    waLink = `https://wa.me/${noWa}?text=${encodeURIComponent(templateInterview.replace(/{perusahaan}/g, l.perusahaan).replace(/{posisi}/g, l.posisi))}`;
                }

                const kartu = document.createElement('div');
                kartu.className = "bg-[#1e1e1e] p-4 rounded-xl shadow-sm border border-gray-800 flex flex-col gap-3";
                kartu.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-base font-bold text-white">${l.perusahaan}</h4>
                            <p class="text-xs text-[#ff5ca0] font-semibold">${l.posisi}</p>
                        </div>
                        <div>
                            ${l.kontak ? `<a href="${waLink}" target="_blank" class="text-xs bg-green-600/20 text-green-400 px-2.5 py-1 rounded-lg font-bold">Konfirmasi Interview</a>` : ''}
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-xs pt-2 border-t border-gray-800">
                        <select onchange="ubahStatus('${l.id}', this.value)" class="text-xs bg-[#2d2d2d] text-gray-300 border border-gray-700 rounded p-1 font-semibold">
                            ${optionsHTML}
                        </select>
                        <button onclick="hapusLamaran('${l.id}')" class="text-red-400 font-bold">Hapus</button>
                    </div>
                `;
                containerCard.appendChild(kartu);

                const baris = document.createElement('tr');
                baris.className = "border-b border-gray-800 hover:bg-[#252525]";
                baris.innerHTML = `
                    <td class="p-3 font-bold text-white">${l.perusahaan}<br><span class="text-[#ff5ca0] text-[11px] font-semibold">${l.posisi}</span></td>
                    <td class="p-3 hidden md:table-cell text-gray-400">${l.tanggal || '-'}</td>
                    <td class="p-3 hidden md:table-cell text-yellow-400">-</td>
                    <td class="p-3">
                        <select onchange="ubahStatus('${l.id}', this.value)" class="text-[11px] bg-[#2d2d2d] text-gray-300 border border-gray-700 rounded p-1 font-semibold">
                            ${optionsHTML}
                        </select>
                    </td>
                    <td class="p-3 text-center">
                        ${l.kontak ? `<a href="${waLink}" target="_blank" class="text-[11px] bg-green-600/20 text-green-400 px-2 py-1 rounded font-bold inline-block mb-1">Konfirmasi Interview</a>` : ''}
                        <button onclick="hapusLamaran('${l.id}')" class="text-red-400 text-[11px] block mx-auto">Hapus</button>
                    </td>
                `;
                containerTabel.appendChild(baris);
            });

            document.getElementById('stat-total').innerText = statTotal;
            document.getElementById('stat-proses').innerText = statProses;
            document.getElementById('stat-interview').innerText = statInterview;
            document.getElementById('stat-diterima').innerText = statDiterima;
            document.getElementById('stat-ditolak').innerText = statDitolak;
            document.getElementById('teks-jumlah-lamaran').innerText = `${filtered.length} dari ${statTotal} lamaran`;
        }
    </script>
</body>
</html>
