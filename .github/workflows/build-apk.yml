name: Build HTML to APK

on:
  push:
    branches:
      - main

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert HTML to APK
        uses: marketplace/actions/html-to-apk-action@v1
        with:
          input-path: '.'
          app-name: 'InfoL'
          package-name: 'com.hipyhan.infol'
