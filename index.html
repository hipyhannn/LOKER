    <style>

            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.03) translateY(-1px); }
        }
        .animate-breathe { animation: breathe 3s ease-in-out infinite; transform-origin: bottom; }

            transform: scale(1.1) rotate(8deg);
